<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Clase 01</title>

  <!-- Tipografías de Google Fonts: Playfair Display (Serif) e Inter (Sans-serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Conexión con tu archivo de estilos -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============================================================ -->
  <!-- ZONA DE TRABAJO: Modificá tus datos personales aquí          -->
  <!-- ============================================================ -->
  <main class="profile-card">
    
    <!-- 1. Foto de perfil -->
    <img 
      class="profile-avatar" 
      src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80" 
      alt="Foto de perfil de Clara Mendizábal"
    >

    <!-- 2. Encabezado personal -->
    <h1 class="profile-name">Clara Mendizábal</h1>
    <p class="profile-role">Diseñadora Editorial & Maquetadora Web</p>
    <p class="profile-bio">
      Creo identidades visuales y sitios web pensados para leer con calma y sin distracciones.
    </p>

    <!-- 3. Lista de enlaces personales / redes -->
    <nav class="profile-links" aria-label="Enlaces personales">
      <a class="profile-link profile-link-featured" href="https://ejemplo.com/portfolio" target="_blank">
        Ver mi Portfolio 2027
      </a>
      <a class="profile-link" href="https://linkedin.com" target="_blank">
        Perfil en LinkedIn
      </a>
      <a class="profile-link" href="https://github.com" target="_blank">
        Proyectos en GitHub
      </a>
      <a class="profile-link" href="mailto:hola@ejemplo.com">
        Escribirme un Email
      </a>
    </nav>

    <!-- 4. Pie de la tarjeta -->
    <footer class="profile-footer">
      <p class="profile-location">📍 Buenos Aires, Argentina · Disponible para proyectos</p>
    </footer>

  </main>

</body>
</html>
